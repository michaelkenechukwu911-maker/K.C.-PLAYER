name: Build KC-Player APK

# Runs automatically every time you push to the repo, and can also be
# triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (required by the Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Generate the Android project
        run: npx cap add android

      - name: Verify the Android project was actually generated
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml was not created — 'npx cap add android' likely failed above. Check that step's log."
            exit 1
          fi
          echo "Found AndroidManifest.xml — proceeding."

      - name: Copy in the custom native permission/video-listing plugin
        run: cp native-plugin-files/MediaAccessPlugin.kt android/app/src/main/java/com/kcplayer/app/MediaAccessPlugin.kt

      - name: Add the video-access permissions to the manifest
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)

          tree = ET.parse(path)
          root = tree.getroot()

          existing = {
              el.get(f"{{{ns}}}name")
              for el in root.findall("uses-permission")
          }

          needed = [
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_EXTERNAL_STORAGE",
          ]

          # Insert permission elements right before <application>, matching
          # where they conventionally belong in a manifest.
          app_index = list(root).index(root.find("application"))

          for i, perm in enumerate(needed):
              if perm in existing:
                  continue
              el = ET.Element("uses-permission")
              el.set(f"{{{ns}}}name", perm)
              if perm == "android.permission.READ_EXTERNAL_STORAGE":
                  el.set(f"{{{ns}}}maxSdkVersion", "32")
              root.insert(app_index, el)
              app_index += 1

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Manifest updated successfully:")
          print(open(path).read())
          EOF

      - name: Register the plugin in MainActivity
        run: |
          cat > android/app/src/main/java/com/kcplayer/app/MainActivity.kt << 'EOF'
          package com.kcplayer.app

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(MediaAccessPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

      - name: Sync the web app into the native project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK so it's downloadable from this run
        uses: actions/upload-artifact@v4
        with:
          name: kc-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
